<div class="content-wrapper ps-2 pe-2">
  <div class="container-fluid flex-grow-1 container-p-y">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center mt-3">
        <img src="/assets/img/base-station-icon-1.png" alt="icon" height="40px" width="auto" />
        <label class="card-header title-content mb-0 ml-2"
          style="font-size: 20px; font-weight: 500; padding-bottom: 10px;">
          SIP Gateways
        </label>
      </div>

      <div>
        <a type="button"
           class="btn btn-red mt-3"
           style="margin-right: 10px;"
           [routerLink]="'./configurations/general'">
          <i class="bx bx-plus"></i>
          Create
        </a>

        <button type="button" class="btn btn-red mt-3" (click)="refresh()">
          <i class="bx bx-refresh"></i>
        </button>
      </div>
    </div>

    <div class="card ps-3 pe-3 pb-4 mt-2 bg-white">
      <div class="table-responsive mt-4">
        <table id="table-sip" class="table" style="width:100%"
               datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger">
          <thead>
            <tr>
              <th>Network ID</th>
              <th>Name</th>
              <th>IP Address </th>
              <th>Port</th>
              <th>Status</th>
              <th class="align-center">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of sipList">
              <td class="align-middle">{{ item.network_id }}</td>
              <td class="align-middle">{{ item.name }}</td>
              <td class="align-middle">{{ item.ip_address }}</td>
              <td class="align-middle">{{ item.port }}</td>
              <td class="align-middle">{{ item.status }}</td>

              <td class="align-center">
                <!-- Config/Edit -->
                <a class="btn btn-sm btn-outline-secondary me-2"
                   title="view record"
                   [routerLink]="'./configurations/' + item.network_id + '/general'">
                  <i class="bx bxs-cog"></i>
                </a>

                <!-- Delete -->
                <button class="btn btn-sm btn-secondary me-2"
                        title="Delete record"
                        (click)="deleteSip(item)">
                  <i class="bx bxs-trash-alt"></i>
                </button>

                <!-- Start -->
                <button [disabled]="item.enabled !== 0"
                        class="btn btn-sm btn-success me-2"
                        title="Start"
                        (click)="runSip(item)">
                  <i class="bx bx-play"></i>
                </button>

                <!-- Stop -->
                <button [disabled]="item.enabled === 0"
                        class="btn btn-sm btn-danger me-2"
                        title="Stop"
                        (click)="stopSip(item)">
                  <i class="bx bx-pause"></i>
                </button>
              </td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" tabindex="-1" role="dialog" id="modalSipGatewaysAction"
     data-bs-backdrop="static" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <app-modal-delete
      [mensaje]="messageShow"
      (confirmAction)="onCloseModal($event)">
    </app-modal-delete>
  </div>
</div>
